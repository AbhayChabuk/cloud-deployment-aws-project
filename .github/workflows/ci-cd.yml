name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: abhaychabuk
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t abhaychabuk/tictactoe-ai:latest .

      - name: Push Docker Image
        run: docker push abhaychabuk/tictactoe-ai:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull abhaychabuk/tictactoe-ai:latest

            if [ "$(docker ps -aq -f name=tictactoe)" ]; then
              docker stop tictactoe
              docker rm tictactoe
            fi

            docker run -d -p 80:8000 --name tictactoe abhaychabuk/tictactoe-ai:latest
